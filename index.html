<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>Ridely - Fast & Reliable Delivery Service | Book a Rider Instantly</title>
  <meta name="title" content="Ridely - Fast & Reliable Delivery Service | Book a Rider Instantly" />
  <meta name="description"
    content="Ridely - Fast, reliable, and secure delivery service. Book a rider instantly and track your packages in real-time. Schedule a pickup in seconds and let Ridely handle the rest." />
  <meta name="keywords"
    content="delivery service, logistics, rider booking, parcel delivery, shipping, courier service, on-demand delivery, package tracking, Ridely, fast delivery, reliable delivery" />
  <meta name="author" content="Ridely" />
  <meta name="robots" content="index, follow" />
  <meta name="language" content="English" />
  <meta name="revisit-after" content="7 days" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ridelyapp.vercel.app/" />
  <meta property="og:title" content="Ridely - Fast & Reliable Delivery Service" />
  <meta property="og:description"
    content="Schedule a pickup in seconds and let Ridely handle the rest. Quick, convenient, and always available. Track your packages in real-time." />
  <meta property="og:image" content="https://ridelyapp.vercel.app/og-image.jpg" />
  <meta property="og:site_name" content="Ridely" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://ridelyapp.vercel.app/" />
  <meta property="twitter:title" content="Ridely - Fast & Reliable Delivery Service" />
  <meta property="twitter:description"
    content="Schedule a pickup in seconds and let Ridely handle the rest. Quick, convenient, and always available." />
  <meta property="twitter:image" content="https://ridelyapp.vercel.app/twitter-image.jpg" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://ridelyapp.vercel.app/" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Ridely",
      "description": "Fast, reliable, and secure delivery service. Book a rider instantly and track your packages in real-time.",
      "url": "https://ridelyapp.vercel.app",
      "logo": "https://ridelyapp.vercel.app/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://www.facebook.com/ridely",
        "https://www.twitter.com/ridely",
        "https://www.instagram.com/ridely",
        "https://www.linkedin.com/company/ridely"
      ]
    }
    </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ridely",
      "url": "https://ridelyapp.vercel.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ridelyapp.vercel.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Delivery Service",
      "provider": {
        "@type": "Organization",
        "name": "Ridely"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Nigeria"
      },
      "description": "Fast, reliable, and secure delivery service. Book a rider instantly and track your packages in real-time.",
      "offers": {
        "@type": "Offer",
        "description": "On-demand delivery service"
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>

</body>

</html>
